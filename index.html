<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1 class="header__title">English Reader</h1>
    <button class="header__settings-btn" id="openSettings" aria-label="Abrir ajustes">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                 a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                 A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
                 l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                 A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
                 l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                 a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
                 l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                 a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- Main -->
  <main class="main">
    <section class="input-section">
      <label class="input-section__label" for="textInput">Pega tu texto en inglés</label>
      <textarea
        class="input-section__textarea"
        id="textInput"
        placeholder="Paste any English text here..."
        rows="12"
        spellcheck="false"
      ></textarea>
      <div class="input-actions">
        <button class="btn btn--primary" id="analyzeBtn">Analizar</button>
        <div class="input-actions__sep" aria-hidden="true"></div>
        <button class="btn btn--secondary" id="cameraBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Tomar foto
        </button>
        <button class="btn btn--secondary" id="uploadBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          Subir foto
        </button>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="sr-only" />
        <input type="file" id="uploadInput" accept="image/*" class="sr-only" />
        <button class="btn btn--ghost hidden" id="clearBtn" aria-label="Limpiar todo">
          Limpiar
        </button>
        <button class="btn btn--ghost hidden" id="translateBtn">
          Ver traducción
        </button>
      </div>
      <div class="ocr-status hidden" id="ocrStatus">
        <div class="ocr-spinner"></div>
        <span id="ocrStatusMsg"></span>
      </div>
    </section>

    <!-- Reading area: las palabras clickeables irán aquí (Etapa 1B) -->
    <section class="reading-section hidden" id="readingSection"></section>

    <!-- Speech bar: Etapa 2 — Listening -->
    <div class="speech-bar hidden" id="speechBar">
      <div class="speech-controls">
        <button class="speech-btn" id="playPauseBtn" aria-label="Reproducir">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </button>
        <button class="speech-btn" id="stopBtn" aria-label="Detener">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>
        <select class="speech-select" id="speedSelect">
          <option value="b2">B2 · 120 wpm</option>
          <option value="c1" selected>C1 · 150 wpm</option>
          <option value="native">Nativo · 180 wpm</option>
        </select>
        <select class="speech-select" id="voiceSelect"></select>
      </div>
    </div>

    <!-- Shadowing bar: Etapa 3 — Shadowing -->
    <div class="speech-bar hidden" id="shadowingBar">
      <div class="speech-controls">
        <button class="shadowing-btn" id="shadowingBtn" aria-label="Iniciar shadowing">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          Shadowing
        </button>
        <span class="shadowing-status" id="shadowingStatus"></span>
      </div>
    </div>

    <!-- Summary bar: Etapa 3 — Resumen libre hablado -->
    <div class="speech-bar hidden" id="summaryBar">
      <div class="speech-controls">
        <button class="shadowing-btn" id="summaryBtn" aria-label="Grabar resumen hablado">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          Resumir en voz alta
        </button>
        <span class="shadowing-status" id="summaryStatus"></span>
      </div>
      <div class="summary-review hidden" id="summaryReview">
        <p class="summary-review__label">Tu resumen</p>
        <p class="summary-review__text" id="summaryTranscript"></p>
        <div class="summary-review__actions">
          <button class="btn btn--secondary" id="summaryRetryBtn">Grabar de nuevo</button>
          <button class="btn btn--primary" id="summarySendBtn">Enviar para feedback</button>
        </div>
      </div>
    </div>

    <!-- Conversation bar: Etapa 3 — Conversación guiada -->
    <div class="speech-bar hidden" id="conversationBar">
      <div class="speech-controls">
        <button class="shadowing-btn" id="conversationStartBtn" aria-label="Iniciar conversación guiada">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          Practicar conversación
        </button>
        <span class="shadowing-status" id="conversationStatus"></span>
      </div>

      <div class="conversation-panel hidden" id="conversationPanel">
        <div class="conversation-question">
          <p class="conversation-question__label">Pregunta <span id="conversationTurnLabel">1</span> de 3</p>
          <p class="conversation-question__text" id="conversationQuestionText"></p>
          <div class="conversation-question__actions">
            <button class="btn btn--secondary" id="conversationListenBtn">🔊 Escuchar</button>
            <button class="shadowing-btn" id="conversationAnswerBtn">Responder</button>
          </div>
        </div>

        <div class="summary-review hidden" id="conversationReview">
          <p class="summary-review__label">Tu respuesta</p>
          <p class="summary-review__text" id="conversationTranscript"></p>
          <div class="summary-review__actions">
            <button class="btn btn--secondary" id="conversationRetryBtn">Grabar de nuevo</button>
            <button class="btn btn--primary" id="conversationSendBtn">Enviar</button>
          </div>
        </div>

        <div class="conversation-feedback hidden" id="conversationFeedback">
          <p class="conversation-feedback__text" id="conversationFeedbackText"></p>
        </div>

        <button class="btn btn--ghost" id="conversationEndBtn">Terminar conversación</button>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settingsOverlay"
       role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="settingsTitle">Ajustes</h2>
        <button class="modal__close" id="closeSettings" aria-label="Cerrar ajustes">&times;</button>
      </div>
      <div class="modal__body">
        <label class="form-label" for="apiKeyInput">API Key de Claude</label>
        <p class="form-hint">Se guarda solo en tu navegador (localStorage). Nunca se sube al repositorio.</p>
        <div class="api-key-wrapper">
          <input
            class="form-input"
            type="password"
            id="apiKeyInput"
            placeholder="sk-ant-..."
            autocomplete="off"
          />
          <button class="btn-icon" id="toggleKeyVisibility" aria-label="Mostrar u ocultar key">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="modal__actions">
          <button class="btn btn--primary" id="saveApiKeyBtn">Guardar</button>
          <span class="save-feedback hidden" id="saveFeedback">Guardado ✓</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Word definition bottom sheet -->
  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet" id="sheet">
      <div class="sheet__handle"></div>
      <button class="sheet__close" id="closeSheet" aria-label="Cerrar ficha">&times;</button>
      <div class="sheet__content" id="sheetContent"></div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/dictionary-api.js"></script>
  <script src="js/ocr-api.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/shadowing.js"></script>
  <script src="js/pronunciation.js"></script>
  <script src="js/summary-api.js"></script>
  <script src="js/conversation-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
